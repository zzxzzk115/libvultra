plugins {
    id 'com.android.application'
}

def vultraRoot = rootDir.parentFile.parentFile
def vultraResourcesDir = new File(vultraRoot, "resources")
def generatedAssetsDir = file("${buildDir}/generated/assets")
def vultraResourcesVpk = new File(generatedAssetsDir, "resources.vpk")
def hostOsName = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT)
def hostArchName = System.getProperty("os.arch").toLowerCase(java.util.Locale.ROOT)
def hostPlatform = hostOsName.contains("mac") || hostOsName.contains("darwin") ? "macosx" : (hostOsName.contains("win") ? "windows" : "linux")
def hostArch = (hostArchName in ["x86_64", "amd64"]) ? "x64" : ((hostArchName in ["aarch64", "arm64"]) ? "arm64" : hostArchName)
def hostVassetCliName = hostPlatform == "windows" ? "vasset-cli.exe" : "vasset-cli"
def importVassetResourcesScript = new File(vultraRoot, hostPlatform == "windows" ? "scripts/import.ps1" : "scripts/import.sh")
def packVassetResourcesScript = new File(vultraRoot, hostPlatform == "windows" ? "scripts/pack.ps1" : "scripts/pack.sh")
def hostVassetCli = new File(vultraRoot, "prebuilt/${hostPlatform}/${hostArch}/${hostVassetCliName}")
def importVassetCommand = hostPlatform == "windows"
        ? [
                "powershell.exe",
                "-NoProfile",
                "-ExecutionPolicy",
                "Bypass",
                "-File",
                importVassetResourcesScript.absolutePath,
                vultraRoot.absolutePath,
                vultraResourcesDir.absolutePath
        ]
        : [
                "sh",
                importVassetResourcesScript.absolutePath,
                vultraRoot.absolutePath,
                vultraResourcesDir.absolutePath
        ]
def packVassetCommand = hostPlatform == "windows"
        ? [
                "powershell.exe",
                "-NoProfile",
                "-ExecutionPolicy",
                "Bypass",
                "-File",
                packVassetResourcesScript.absolutePath,
                vultraRoot.absolutePath,
                vultraResourcesDir.absolutePath,
                vultraResourcesVpk.absolutePath
        ]
        : [
                "sh",
                packVassetResourcesScript.absolutePath,
                vultraRoot.absolutePath,
                vultraResourcesDir.absolutePath,
                vultraResourcesVpk.absolutePath
        ]

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

android {
    namespace "org.libvultra.android"
    compileSdk 36
    defaultConfig {
        applicationId "org.libvultra.android"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                abiFilters = project.findProperty('abiFilters')?.split(',') ?: ['arm64-v8a']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    ndkVersion "30.0.14904198"

    sourceSets {
        main {
            jniLibs.srcDir(file("${buildDir}/generated/jniLibs"))
            assets.srcDirs += [generatedAssetsDir]
        }
    }
    buildFeatures {
        prefab true
    }
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def vultraRuntimeOutput = new File(vultraRoot, "build/android")
def generatedJniLibsDir = file("${buildDir}/generated/jniLibs")
def resolvedAbiFilters = (project.findProperty('abiFilters')?.split(',') ?: ['arm64-v8a']).collect { it.trim() }
def buildMode = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") } ? "release" : "debug"
def xmakeGlobalDir = new File(localProperties.getProperty("xmake.global.dir") ?: System.getenv("XMAKE_GLOBALDIR") ?: System.getProperty("user.home"), ".xmake").absolutePath
def xmakePackagesDir = new File(xmakeGlobalDir, "packages")
def resolveOpenXRLoaderForAbi = { abi ->
    fileTree(xmakePackagesDir) {
        include("o/openxr/*/*/jni/${abi}/libopenxr_loader.so")
    }.files.toList().sort { a, b -> a.absolutePath <=> b.absolutePath }.find()
}

tasks.register("prepareVultraResourcesVpk", Exec) {
    outputs.file(vultraResourcesVpk)
    inputs.file(packVassetResourcesScript)
    inputs.file(importVassetResourcesScript)
    inputs.file(hostVassetCli)
    inputs.dir(vultraResourcesDir)
    workingDir vultraRoot
    commandLine packVassetCommand

    doFirst {
        generatedAssetsDir.mkdirs()
    }
}

tasks.register("prepareVultraResourcesImport", Exec) {
    inputs.file(importVassetResourcesScript)
    inputs.file(hostVassetCli)
    inputs.dir(vultraResourcesDir)
    workingDir vultraRoot
    commandLine importVassetCommand
}

tasks.named("prepareVultraResourcesVpk") {
    dependsOn(tasks.named("prepareVultraResourcesImport"))
}

def prepareVultraRuntimeJniLibs = tasks.register("prepareVultraRuntimeJniLibs", Copy) {
    from(vultraRuntimeOutput) {
        resolvedAbiFilters.each { abi ->
            include("${abi}/${buildMode}/example-android-app-runtime/libvultra_android_runtime.so")
        }
        eachFile {
            def abi = path.substring(0, path.indexOf('/'))
            path = "${abi}/${name}"
        }
        includeEmptyDirs = false
    }
    into(generatedJniLibsDir)

    resolvedAbiFilters.each { abi ->
        def openxrLoader = resolveOpenXRLoaderForAbi(abi)
        if (openxrLoader != null) {
            from(openxrLoader) {
                into(abi)
            }
        }
    }
}

tasks.named("preBuild") {
    dependsOn(tasks.named("prepareVultraResourcesImport"))
    dependsOn(tasks.named("prepareVultraResourcesVpk"))
    dependsOn(prepareVultraRuntimeJniLibs)
}

dependencies {
    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.games:games-activity:4.4.0'
}
