<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vultra Example</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #171a1e; }
        canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
        #status { position: absolute; top: 12px; left: 12px; right: 12px; margin: 0; padding: 12px;
                  max-height: calc(100% - 48px); overflow: auto; color: #eee; background: #171a1eee;
                  font: 14px monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <canvas id="canvas" tabindex="0"></canvas>
    <pre id="status" role="status">Loading Vultra...</pre>
    <script>
        const statusElement = document.getElementById("status");
        let consoleOutput = "";
        function showError(message) {
            statusElement.hidden = false;
            statusElement.textContent = "Vultra: " + message;
        }
        var Module = {
            canvas: document.getElementById("canvas"),
            arguments: new URLSearchParams(location.search).getAll("arg"),
            print: function(message) {
                console.log(message);
                consoleOutput += message + "\n";
                statusElement.hidden = false;
                statusElement.textContent = consoleOutput;
            },
            printErr: function(message) {
                console.error(message);
                if (message.includes("[error]")) {
                    showError(message);
                }
            },
            onAbort: showError,
            onRuntimeInitialized: function() {
                statusElement.textContent = "Starting graphics...";
            },
            onGraphicsReady: function() { statusElement.hidden = true; }
        };
        window.addEventListener("error", function(event) {
            showError(event.message || "Could not load the application. Check the browser console.");
        }, true);
        window.addEventListener("unhandledrejection", function(event) { showError(String(event.reason)); });
        Module.canvas.focus();
    </script>
    {{{ SCRIPT }}}
</body>
</html>
