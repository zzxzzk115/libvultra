name: Build WASM

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Sync submodules
        run: git submodule update --init --recursive

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: ".xmake-cache"
          build-cache: true

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake git clang ninja-build pkg-config

      - name: Verify emsdk
        run: |
          emcc -v
          xmake --version

      - name: Configure WASM Build
        run: xmake f -p wasm --policies=build.ccache:y --libvultra_build_examples=y --libvultra_build_tests=n -y

      - name: Build demo app
        run: xmake repo -u && xmake build -y example-demo-app

      - name: Collect failure logs
        if: failure()
        run: |
          mkdir -p ci-logs
          LOG_FILE="ci-logs/install_logs.txt"
          touch "$LOG_FILE"
          while IFS= read -r f; do
            echo "==== $f ====" >> "$LOG_FILE"
            cat "$f" >> "$LOG_FILE"
            echo "" >> "$LOG_FILE"
          done < <(find "$HOME/.xmake/cache" -name install.txt 2>/dev/null)

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-wasm-${{ github.run_id }}
          path: ci-logs
          if-no-files-found: ignore
