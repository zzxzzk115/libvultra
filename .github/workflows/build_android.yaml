name: Build Android

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: "true"

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: ".xmake-cache"
          build-cache: true

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install build-essential cmake git clang ninja-build -y

      - name: Install Android NDK
        run: sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "ndk;30.0.14904198"

      - name: Verify Android NDK Path
        run: |
          test -d "${ANDROID_SDK_ROOT}/ndk/30.0.14904198"
          test -d "${ANDROID_SDK_ROOT}/ndk/30.0.14904198/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ls -la "${ANDROID_SDK_ROOT}/ndk/30.0.14904198/toolchains/llvm/prebuilt/linux-x86_64/bin"

      - name: Configure Android Build
        run: xmake f -p android --ndk="${ANDROID_SDK_ROOT}/ndk/30.0.14904198" --policies=build.ccache:y --libvultra_build_examples=n --libvultra_build_tests=n -y

      - name: Show Targets
        run: xmake show -l targets

      - name: Build
        run: xmake repo -u && xmake -vD -y

      - name: Collect failure logs
        if: failure()
        run: |
          mkdir -p ci-logs
          LOG_FILE="ci-logs/install_logs.txt"
          touch "$LOG_FILE"
          while IFS= read -r f; do
            echo "==== $f ====" >> "$LOG_FILE"
            cat "$f" >> "$LOG_FILE"
            echo "" >> "$LOG_FILE"
          done < <(find "$HOME/.xmake/cache" -name install.txt 2>/dev/null)

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-android-${{ github.run_id }}
          path: ci-logs
          if-no-files-found: ignore
