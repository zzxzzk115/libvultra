name: Build macOS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: "true"

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: '.xmake-cache'
          build-cache: true

      - name: Prepare Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Cache Build
        run: xmake f --policies=build.ccache:y -y

      - name: Build
        run: xmake repo -u && xmake -vD -y

      - name: Collect failure logs
        if: failure()
        run: |
          mkdir -p ci-logs
          LOG_FILE="ci-logs/install_logs.txt"
          touch "$LOG_FILE"
          while IFS= read -r f; do
            echo "==== $f ====" >> "$LOG_FILE"
            cat "$f" >> "$LOG_FILE"
            echo "" >> "$LOG_FILE"
          done < <(find "$HOME/.xmake/cache" -name install.txt 2>/dev/null)

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-macos-${{ github.run_id }}
          path: ci-logs
          if-no-files-found: ignore
