name: Deploy Examples Pages

on:
  push:
    branches: [webgpu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: webgpu

      - name: Sync submodules
        run: git submodule update --init --recursive

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: ".xmake-cache"
          build-cache: true

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Install dependencies
        run: brew install ninja pkg-config

      - name: Configure WASM Build
        run: xmake f -p wasm --policies=build.ccache:y --libvultra_build_examples=y --libvultra_build_tests=n -y

      - name: Build WASM examples
        run: xmake repo -u && xmake build -y example-demo-app && xmake build -y example-gaussian-splatting

      - name: Prepare pages site
        run: |
          mkdir -p site
          cp web/index.html site/index.html

          prepare_example() {
            local source_dir="$1"
            local page_title="$2"
            local html_name="$3"
            local slug="${html_name%.html}"

            mkdir -p "site/${slug}"
            rsync -av --delete "${source_dir}/" "site/${slug}/"
            if [ -f "site/${slug}/${html_name}" ]; then
              mv "site/${slug}/${html_name}" "site/${slug}/index.html"
              PAGE_TITLE="${page_title}" perl -0pi -e 'my $title = $ENV{PAGE_TITLE}; s{<title>libvultra</title>}{<title>${title} | libvultra</title>}g' "site/${slug}/index.html"
            fi
          }

          prepare_example "build/wasm/wasm32/release/example-demo-app" "Demo App" "example-demo-app.html"
          prepare_example "build/wasm/wasm32/release/example-gaussian-splatting" "Gaussian Splatting" "example-gaussian-splatting.html"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Collect failure logs
        if: failure()
        run: |
          mkdir -p ci-logs
          LOG_FILE="ci-logs/install_logs.txt"
          touch "$LOG_FILE"
          while IFS= read -r f; do
            echo "==== $f ====" >> "$LOG_FILE"
            cat "$f" >> "$LOG_FILE"
            echo "" >> "$LOG_FILE"
          done < <(find "$HOME/.xmake/cache" -name install.txt 2>/dev/null)

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-pages-build-${{ github.run_id }}
          path: ci-logs
          if-no-files-found: ignore

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
