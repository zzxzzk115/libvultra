name: Deploy Demo App Pages

on:
  push:
    branches: [webgpu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
          ref: webgpu

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: ".xmake-cache"
          build-cache: true

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Install dependencies
        run: brew install ninja pkg-config

      - name: Configure WASM Build
        run: xmake f -p wasm --policies=build.ccache:y --libvultra_build_examples=y --libvultra_build_tests=n -y

      - name: Build demo app
        run: xmake repo -u && xmake build -y example-demo-app

      - name: Prepare pages site
        run: |
          mkdir -p site
          rsync -av --delete build/wasm/wasm32/release/example-demo-app/ site/
          if [ -f site/example-demo-app.html ] && [ ! -f site/index.html ]; then
            cp site/example-demo-app.html site/index.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
