name: Build Windows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Sync submodules
        shell: pwsh
        run: git submodule update --init --recursive

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: '.xmake-cache'
          build-cache: true

      - name: Prepare Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Cache Build
        run: xmake f --policies=build.ccache:y -y

      - name: Build
        shell: pwsh
        run: xmake repo -u && xmake -vD -y

      - name: Collect failure logs
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          $logFile = "ci-logs/install_logs.txt"
          New-Item -ItemType File -Force -Path $logFile | Out-Null
          $cachePath = Join-Path $env:USERPROFILE ".xmake\\cache"
          if (Test-Path $cachePath) {
            Get-ChildItem -Path $cachePath -Recurse -Filter install.txt | ForEach-Object {
              Add-Content -Path $logFile -Value ("==== " + $_.FullName + " ====")
              Get-Content -Path $_.FullName | Add-Content -Path $logFile
              Add-Content -Path $logFile -Value ""
            }
          }

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-windows-${{ github.run_id }}
          path: ci-logs
          if-no-files-found: ignore
