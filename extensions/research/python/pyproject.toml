[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vultra-research"
version = "0.1.0"
description = "Optional NumPy research sessions through Vultra's generated C ABI"
requires-python = ">=3.10"
dependencies = ["numpy>=2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vultra"]
